<body>
  <div id="__bundler_placeholder">Loading promagicbox — Portfolio...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ce with commonly used Discord moderation and management bots, including ticketing, logging, permissions, and automation workflows.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"wrap sec\" id=\"approach\">\n<div class=\"head rv\"><span class=\"mono acc\">03<\u002Fspan><h2 class=\"sh\"><span class=\"w\"><i>Moderation<\u002Fi><\u002Fspan> <span class=\"w\"><i>approach<\u002Fi><\u002Fspan><\u002Fh2><\u002Fdiv>\n<div class=\"steps rv\" data-s=\"{{ sd }}\">\n<article class=\"step spot {{ sc0 }}\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\"><i class=\"sp\" aria-hidden=\"true\"><\u002Fi><span class=\"num\" aria-hidden=\"true\">01<\u002Fspan><h3><button type=\"button\" class=\"stb\" aria-current=\"{{ sa0 }}\" sc-camel-on-click=\"{{ spick0 }}\">Understand the context<\u002Fbutton><\u002Fh3><p>Review the situation before making a decision.<\u002Fp><span class=\"barwrap\" aria-hidden=\"true\"><i class=\"bar\" sc-camel-on-animation-end=\"{{ stepNext }}\"><\u002Fi><\u002Fspan><\u002Farticle>\n<article class=\"step spot {{ sc1 }}\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\"><i class=\"sp\" aria-hidden=\"true\"><\u002Fi><span class=\"num\" aria-hidden=\"true\">02<\u002Fspan><h3><button type=\"button\" class=\"stb\" aria-current=\"{{ sa1 }}\" sc-camel-on-click=\"{{ spick1 }}\">Communicate clearly<\u002Fbutton><\u002Fh3><p>Explain rules and actions without unnecessary confrontation.<\u002Fp><span class=\"barwrap\" aria-hidden=\"true\"><i class=\"bar\" sc-camel-on-animation-end=\"{{ stepNext }}\"><\u002Fi><\u002Fspan><\u002Farticle>\n<article class=\"step spot {{ sc2 }}\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\"><i class=\"sp\" aria-hidden=\"true\"><\u002Fi><span class=\"num\" aria-hidden=\"true\">03<\u002Fspan><h3><button type=\"button\" class=\"stb\" aria-current=\"{{ sa2 }}\" sc-camel-on-click=\"{{ spick2 }}\">Keep the team informed<\u002Fbutton><\u002Fh3><p>Document relevant incidents and escalate when needed.<\u002Fp><span class=\"barwrap\" aria-hidden=\"true\"><i class=\"bar\" sc-camel-on-animation-end=\"{{ stepNext }}\"><\u002Fi><\u002Fspan><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"wrap sec\" id=\"contact\">\n<div class=\"cta spot rv\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\">\n<i class=\"sp\" aria-hidden=\"true\"><\u002Fi>\n<div><span class=\"mono acc\">04 · Contact<\u002Fspan><h2 class=\"sh\"><span class=\"w\"><i>Let’s<\u002Fi><\u002Fspan> <span class=\"w\"><i>discuss<\u002Fi><\u002Fspan> <span class=\"w\"><i>your<\u002Fi><\u002Fspan> <span class=\"w\"><i>server.<\u002Fi><\u002Fspan><\u002Fh2><\u002Fdiv>\n<div>\n<p class=\"body mut\">I’m primarily interested in paid moderation roles. I’m also open to discussing freelance work depending on the scope. Include your server type, responsibilities, expected schedule, and budget.<\u002Fp>\n<div class=\"rows\">\n<div class=\"row\"><span><span class=\"mono mut lab\">Discord<\u002Fspan><strong>pmgcb.<\u002Fstrong><\u002Fspan><button type=\"button\" class=\"btn mag\" data-c=\"{{ copyState }}\" sc-camel-on-click=\"{{ copyName }}\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\">{{ copyLabel }}<\u002Fbutton><\u002Fdiv>\n<a class=\"row\" href=\"mailto:promagicbox@gmail.com?subject=Discord%20moderation%20role%20inquiry\"><span><span class=\"mono mut lab\">Email<\u002Fspan><strong>promagicbox@gmail.com<\u002Fstrong><\u002Fspan><svg class=\"arr acc\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<p class=\"note mut\">Availability and compensation discussed based on the role.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"wrap\">\n<p class=\"wm rv\" aria-hidden=\"true\" sc-camel-on-mouse-move=\"{{ fx }}\" sc-camel-on-mouse-leave=\"{{ fxOut }}\">promagicbox<\u002Fp>\n<div class=\"foot\"><span><b>promagicbox<\u002Fb> · Senior Discord Moderator<\u002Fspan><span>© 2026<\u002Fspan><a class=\"totop\" href=\"#top\">Back to top<svg class=\"arr\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 19V5M6 11l6-6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv>\n<\u002Ffooter>\n\n<div class=\"pal\" data-open=\"{{ palIsOpen }}\">\n<button type=\"button\" class=\"scrim\" tabindex=\"-1\" aria-label=\"Close quick jump\" sc-camel-on-click=\"{{ palClose }}\"><\u002Fbutton>\n<div class=\"pbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Quick jump\" sc-camel-on-key-down=\"{{ palKey }}\">\n<div class=\"pin\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M16 16l4.5 4.5\"><\u002Fpath><\u002Fsvg><input id=\"palq\" class=\"pi\" type=\"text\" role=\"combobox\" aria-label=\"Jump to\" aria-expanded=\"true\" aria-controls=\"pallist\" aria-autocomplete=\"list\" aria-activedescendant=\"{{ palActive }}\" placeholder=\"Jump to a section, copy contact, change theme\" autocomplete=\"off\" spellcheck=\"false\" value=\"{{ palQ }}\" sc-camel-on-change=\"{{ palInput }}\"><span class=\"mono kbd\" aria-hidden=\"true\">Esc<\u002Fspan><\u002Fdiv>\n<ul id=\"pallist\" class=\"plist\" role=\"listbox\" aria-label=\"Results\">\n<sc-for list=\"{{ palItems }}\" as=\"it\" hint-placeholder-count=\"9\">\n<li class=\"pli\" role=\"presentation\"><sc-if value=\"{{ it.hasGh }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"pg mono mut\">{{ it.group }}<\u002Fspan><\u002Fsc-if><button type=\"button\" role=\"option\" tabindex=\"-1\" id=\"{{ it.pid }}\" class=\"po {{ it.cls }}\" aria-selected=\"{{ it.sel }}\" sc-camel-on-click=\"{{ it.run }}\" sc-camel-on-mouse-enter=\"{{ it.hover }}\"><span>{{ it.label }}<\u002Fspan><span class=\"mono mut ph\">{{ it.hint }}<\u002Fspan><\u002Fbutton><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<p class=\"pempty mut\" data-show=\"{{ palEmpty }}\">No matches<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" role=\"status\" aria-live=\"polite\" data-on=\"{{ toastOn }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>{{ toastMsg }}<\u002Fspan><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;midnight&quot;,&quot;options&quot;:[&quot;midnight&quot;,&quot;light&quot;,&quot;dusk&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4000}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.tick();\n    this._clock = setInterval(() => this.tick(), 15000);\n    try {\n      if ('IntersectionObserver' in window) {\n        this._io = new IntersectionObserver((entries) => {\n          entries.forEach((en) => {\n            if (en.isIntersecting && this.state.active !== en.target.id) this.setState({ active: en.target.id });\n          });\n        }, { rootMargin: '-45% 0px -50% 0px' });\n        ['home', 'about', 'experience', 'approach', 'contact'].forEach((id) => {\n          const el = document.getElementById(id);\n          if (el) this._io.observe(el);\n        });\n      }\n    } catch (e) {}\n  }\n  componentWillUnmount() {\n    clearInterval(this._clock);\n    clearTimeout(this._toastTimer);\n    clearTimeout(this._copyTimer);\n    try { if (this._io) this._io.disconnect(); } catch (e) {}\n  }\n  componentDidUpdate(prev) {\n    // A change to the Tweaks theme replaces whatever the visitor picked on the page.\n    if (prev && prev.theme !== this.props.theme && this.state.theme) this.setState({ theme: null });\n  }\n\n  tick() {\n    try {\n      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());\n      const hh = parts.find((p) => p.type === 'hour').value;\n      const mm = parts.find((p) => p.type === 'minute').value;\n      if (hh !== this.state.hh || mm !== this.state.mm) this.setState({ hh, mm });\n    } catch (e) {}\n  }\n\n  /* pointer helpers: write CSS variables straight onto the element, no re-render */\n  fx(e) {\n    const el = e.currentTarget;\n    if (!el || !el.getBoundingClientRect) return;\n    const r = el.getBoundingClientRect();\n    const x = e.clientX - r.left, y = e.clientY - r.top;\n    const s = el.style;\n    s.setProperty('--mx', x + 'px');\n    s.setProperty('--my', y + 'px');\n    s.setProperty('--rx', (x / r.width - 0.5).toFixed(3));\n    s.setProperty('--ry', (y / r.height - 0.5).toFixed(3));\n  }\n  fxOut(e) {\n    const s = e.currentTarget.style;\n    s.setProperty('--rx', '0');\n    s.setProperty('--ry', '0');\n    s.removeProperty('--mx');\n    s.removeProperty('--my');\n  }\n  rootMove(e) {\n    const s = e.currentTarget.style;\n    const w = window.innerWidth || 1, h = window.innerHeight || 1;\n    s.setProperty('--px', ((e.clientX / w - 0.5) * 2).toFixed(3));\n    s.setProperty('--py', ((e.clientY / h - 0.5) * 2).toFixed(3));\n    s.setProperty('--cx', e.clientX + 'px');\n    s.setProperty('--cy', e.clientY + 'px');\n    s.setProperty('--ca', '1');\n  }\n  rootLeave(e) {\n    e.currentTarget.style.setProperty('--ca', '0');\n  }\n\n  /* theme: circular reveal from the control that was used */\n  themeFromEvent(t, e) {\n    let x = (window.innerWidth || 1280) / 2, y = 0;\n    try {\n      const r = e.currentTarget.getBoundingClientRect();\n      x = r.left + r.width / 2;\n      y = r.top + r.height / 2;\n    } catch (err) {}\n    this.applyTheme(t, x, y);\n  }\n  applyTheme(t, x, y) {\n    const cur = this.state.theme || this.props.theme || 'midnight';\n    if (cur === t) return;\n    const root = document.getElementById('top');\n    const commit = () => {\n      if (root) root.setAttribute('data-theme', t);\n      this.setState({ theme: t });\n    };\n    let reduce = false;\n    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) {}\n    if (document.startViewTransition && !reduce) {\n      try {\n        const de = document.documentElement;\n        de.style.setProperty('--vx', x + 'px');\n        de.style.setProperty('--vy', y + 'px');\n        document.startViewTransition(commit);\n        return;\n      } catch (err) {}\n    }\n    commit();\n  }\n\n  /* experience tabs */\n  pickTab(i, focus) {\n    this.setState({ tab: i });\n    if (focus) {\n      const el = document.getElementById('tb' + i);\n      if (el) el.focus();\n    }\n  }\n  tabKey(e) {\n    const cur = this.state.tab || 0;\n    let n = null;\n    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (cur + 1) % 4;\n    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (cur + 3) % 4;\n    else if (e.key === 'Home') n = 0;\n    else if (e.key === 'End') n = 3;\n    if (n !== null) {\n      e.preventDefault();\n      this.pickTab(n, true);\n    }\n  }\n  stepNext(e) {\n    if (e && e.target !== e.currentTarget) return;\n    this.setState({ step: ((this.state.step || 0) + 1) % 3 });\n  }\n\n  /* copy + toast */\n  showToast(msg) {\n    this.setState({ toast: msg, toastOn: true });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toastOn: false }), 2400);\n  }\n  fallbackCopy(text) {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.setAttribute('readonly', '');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';\n      document.body.appendChild(ta);\n      ta.select();\n      const ok = document.execCommand('copy');\n      document.body.removeChild(ta);\n      return !!ok;\n    } catch (e) {\n      return false;\n    }\n  }\n  copyText(text, cb) {\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(text).then(() => cb(true), () => cb(this.fallbackCopy(text)));\n        return;\n      }\n    } catch (e) {}\n    cb(this.fallbackCopy(text));\n  }\n  copyName() {\n    this.copyText('pmgcb.', (ok) => {\n      this.setState({ copy: ok ? 'ok' : 'fail' });\n      clearTimeout(this._copyTimer);\n      this._copyTimer = setTimeout(() => this.setState({ copy: 'idle' }), 2400);\n      this.showToast(ok ? 'Copied pmgcb.' : 'Copy blocked, select the name instead');\n    });\n  }\n  copyEmail() {\n    this.copyText('promagicbox@gmail.com', (ok) => {\n      this.showToast(ok ? 'Copied promagicbox@gmail.com' : 'Copy blocked, select the address instead');\n    });\n  }\n\n  /* quick-jump palette */\n  palAll() {\n    return [\n      { id: 'about', g: 'Go to', t: 'About' },\n      { id: 'experience', g: 'Go to', t: 'Experience' },\n      { id: 'approach', g: 'Go to', t: 'Approach' },\n      { id: 'contact', g: 'Go to', t: 'Contact' },\n      { id: 'copy-discord', g: 'Copy', t: 'Discord username', h: 'pmgcb.' },\n      { id: 'copy-email', g: 'Copy', t: 'Email address', h: 'promagicbox@gmail.com' },\n      { id: 'theme-midnight', g: 'Theme', t: 'Midnight' },\n      { id: 'theme-light', g: 'Theme', t: 'Light' },\n      { id: 'theme-dusk', g: 'Theme', t: 'Dusk' }\n    ];\n  }\n  palFiltered() {\n    const q = (this.state.palq || '').trim().toLowerCase();\n    const all = this.palAll();\n    return q ? all.filter((i) => (i.t + ' ' + i.g + ' ' + (i.h || '')).toLowerCase().indexOf(q) >= 0) : all;\n  }\n  palOpen() {\n    this.setState({ pal: true, palq: '', pals: 0 });\n    setTimeout(() => {\n      const el = document.getElementById('palq');\n      if (el) el.focus();\n    }, 60);\n  }\n  palClose(restore) {\n    this.setState({ pal: false });\n    if (restore) {\n      const b = document.getElementById('palbtn');\n      if (b) b.focus({ preventScroll: true });\n    }\n  }\n  palInput(e) {\n    this.setState({ palq: e.target.value, pals: 0 });\n  }\n  palReveal(s) {\n    setTimeout(() => {\n      const el = document.getElementById('pi' + s);\n      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });\n    }, 0);\n  }\n  palKey(e) {\n    const list = this.palFiltered();\n    const n = list.length;\n    const s = Math.min(this.state.pals || 0, Math.max(n - 1, 0));\n    if (e.key === 'ArrowDown') {\n      e.preventDefault();\n      const k = n ? (s + 1) % n : 0;\n      this.setState({ pals: k });\n      this.palReveal(k);\n    } else if (e.key === 'ArrowUp') {\n      e.preventDefault();\n      const k = n ? (s + n - 1) % n : 0;\n      this.setState({ pals: k });\n      this.palReveal(k);\n    } else if (e.key === 'Enter') {\n      e.preventDefault();\n      if (list[s]) this.runPal(list[s]);\n    } else if (e.key === 'Escape') {\n      e.preventDefault();\n      this.palClose(true);\n    } else if (e.key === 'Tab') {\n      e.preventDefault();\n    }\n  }\n  runPal(item) {\n    this.palClose(false);\n    const id = item.id;\n    if (/^(about|experience|approach|contact)$/.test(id)) {\n      const el = document.getElementById(id);\n      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    } else if (id === 'copy-discord') {\n      this.copyName();\n    } else if (id === 'copy-email') {\n      this.copyEmail();\n    } else if (id.indexOf('theme-') === 0) {\n      this.applyTheme(id.slice(6), (window.innerWidth || 1280) / 2, (window.innerHeight || 800) / 3);\n    }\n  }\n\n  renderVals() {\n    const st = this.state || {};\n    const theme = st.theme || this.props.theme || 'midnight';\n    const copy = st.copy || 'idle';\n    const tab = st.tab || 0;\n    const step = st.step || 0;\n    const active = st.active || 'home';\n    const burst = st.burst || 0;\n    const roll = st.roll || 0;\n    const sk = ['Tickets', 'Appeals', 'Explaining decisions', 'Server rules', 'Rules enforcement', 'Raid response', 'Conflict handling', 'Escalation', 'Permissions', 'Bot setup', 'Moderation tooling', 'Workflows', 'Staff training', 'Coordination', 'Events'];\n    const nav = [['about', 'About'], ['experience', 'Experience'], ['approach', 'Approach'], ['contact', 'Contact']];\n    const navIdx = nav.findIndex((n) => n[0] === active);\n    const about = 'I’ve moderated communities with very different audiences and expectations, and I’ve done the hands-on work: answering members, making calls, and configuring the server behind them.'.split(' ');\n    const digs = [];\n    for (let k = 0; k < 20; k++) digs.push({ n: k % 10 });\n    const plist = this.palFiltered();\n    const psel = Math.min(st.pals || 0, Math.max(plist.length - 1, 0));\n    const v = {\n      theme,\n      active,\n      pMid: String(theme === 'midnight'),\n      pLight: String(theme === 'light'),\n      pDusk: String(theme === 'dusk'),\n      setMidnight: (e) => this.themeFromEvent('midnight', e),\n      setLight: (e) => this.themeFromEvent('light', e),\n      setDusk: (e) => this.themeFromEvent('dusk', e),\n      fx: (e) => this.fx(e),\n      fxOut: (e) => this.fxOut(e),\n      rootMove: (e) => this.rootMove(e),\n      rootLeave: (e) => this.rootLeave(e),\n      navItems: nav.map((n, i) => ({ href: '#' + n[0], label: n[1], cls: i === navIdx ? 'on' : '', cur: i === navIdx ? 'true' : 'false' })),\n      navIdx: String(Math.max(navIdx, 0)),\n      navOn: String(navIdx >= 0),\n      hh: st.hh || '--',\n      mm: st.mm || '--',\n      burstCls: burst ? 'b' + (burst % 2) : '',\n      burst: () => this.setState({ burst: (this.state.burst || 0) + 1 }),\n      rollCls: roll ? 'r' + (roll % 2) : '',\n      reroll: () => this.setState({ roll: (this.state.roll || 0) + 1 }),\n      digs,\n      skills: sk.map((t) => ({ t })),\n      skillsRev: sk.slice().reverse().map((t) => ({ t })),\n      aboutWords: about.map((w, i) => ({ t: i < about.length - 1 ? w + ' ' : w })),\n      tab: String(tab),\n      tabKey: (e) => this.tabKey(e),\n      sd: String(step),\n      stepNext: (e) => this.stepNext(e),\n      copyName: () => this.copyName(),\n      copyState: copy,\n      copyLabel: copy === 'ok' ? 'Copied pmgcb.' : copy === 'fail' ? 'Copy blocked — select the name' : 'Copy Discord username',\n      toastOn: String(!!st.toastOn),\n      toastMsg: st.toast || '',\n      palIsOpen: String(!!st.pal),\n      palOpen: () => this.palOpen(),\n      palClose: () => this.palClose(true),\n      palKey: (e) => this.palKey(e),\n      palInput: (e) => this.palInput(e),\n      palQ: st.palq || '',\n      palActive: plist.length ? 'pi' + psel : '',\n      palEmpty: String(plist.length === 0),\n      palItems: plist.map((it, i) => ({\n        pid: 'pi' + i,\n        label: it.t,\n        group: it.g,\n        hint: it.h || '',\n        hasGh: i === 0 || plist[i - 1].g !== it.g,\n        cls: i === psel ? 'on' : '',\n        sel: String(i === psel),\n        run: () => this.runPal(it),\n        hover: () => { if (this.state.pals !== i) this.setState({ pals: i }); }\n      }))\n    };\n    for (let i = 0; i < 4; i++) {\n      v['tc' + i] = tab === i ? 'on' : '';\n      v['ts' + i] = String(tab === i);\n      v['tti' + i] = tab === i ? '0' : '-1';\n      v['tpick' + i] = () => this.pickTab(i, false);\n    }\n    for (let i = 0; i < 3; i++) {\n      v['sc' + i] = step === i ? 'on' : '';\n      v['sa' + i] = step === i ? 'true' : 'false';\n      v['spick' + i] = () => this.setState({ step: i });\n    }\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
